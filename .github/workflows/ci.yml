name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    services:
      hardhat-node:
        image: ethereumoptimism/hardhat-node:latest
        ports:
          - 8545:8545
        options: >-
          --health-cmd "curl -s http://localhost:8545"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      working-directory: ./medi-chain
    
    - name: Run smart contract tests
      run: npm test
      working-directory: ./medi-chain
      env:
        REPORT_GAS: true
        
    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./medi-chain-frontend
      
    - name: Run frontend tests
      run: npm test -- --coverage
      working-directory: ./medi-chain-frontend
      env:
        CI: true
        
    - name: Build frontend
      run: npm run build
      working-directory: ./medi-chain-frontend
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./medi-chain-frontend/coverage
        fail_ci_if_error: false

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./medi-chain
      
    - name: Deploy contracts
      run: npx hardhat run scripts/deploy.js --network ${{ secrets.NETWORK_NAME || 'localhost' }}
      working-directory: ./medi-chain
      env:
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
        
    - name: Install frontend dependencies
      run: npm ci
      working-directory: ./medi-chain-frontend
      
    - name: Build frontend
      run: |
        echo "VITE_CONTRACT_ADDRESS=${{ secrets.CONTRACT_ADDRESS }}" >> .env
        echo "VITE_NETWORK_NAME=${{ secrets.NETWORK_NAME }}" >> .env
        npm run build
      working-directory: ./medi-chain-frontend
      
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./medi-chain-frontend
        vercel-args: '--prod'
